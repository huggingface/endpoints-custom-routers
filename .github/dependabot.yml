# This repository's actions are pinned to commit SHAs. A pinned SHA is
# only safe while something raises it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Releases younger than this are not adopted. The hours right after a
    # maintainer account is compromised are exactly when a fresh release
    # is most dangerous — tj-actions and the reviewdog actions both
    # travelled that way.
    cooldown:
      default-days: 7
    # One pull request a week for all of them, rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
